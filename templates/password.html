{% extends 'base.html' %}
{% block content %}
<div class="panel" style="max-width:380px">
  <h5>Change Password</h5>
  <form method="post">
    <input name="old" type="password" class="form-control form-control-sm mb-2" placeholder="Old password" required>
    <input name="new" type="password" class="form-control form-control-sm mb-2" placeholder="New password (min 6)" required>
    <button class="btn btn-primary btn-sm">Change</button>
  </form>
</div>
{% endblock %}
